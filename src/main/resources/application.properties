spring.application.name=ecommerce-backend
server.port=8080

# ---------------------------------------------------------------------------
# Default profile: zero-setup local run. H2 in-memory DB; Redis is optional
# (popular-products cache degrades gracefully to the database if Redis is down).
# Activate the "mysql" profile for a real database: --spring.profiles.active=mysql
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Redis (used for the popular-products cache)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Third-party product catalogue used for bootstrapping / fallback
fakestore.base-url=https://fakestoreapi.com

# Product source: "self" (own DB) or "fakestore" (proxy to FakeStore API)
product.source=self

# Payment gateways (test keys; override via environment variables)
payment.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
payment.stripe.api-key=${STRIPE_API_KEY:sk_test_placeholder}
payment.default-provider=RAZORPAY

# Auth session TTL (48 hours)
auth.session-ttl-millis=172800000

# Popular products cache
cache.popular.key=popular_products
cache.popular.ttl-seconds=600
cache.popular.keywords=iphone,macbook,jordan,rolex

management.endpoints.web.exposure.include=health,info
# Redis is an optional accelerator; its outage must not flip the health check used by load balancers
management.health.redis.enabled=false
