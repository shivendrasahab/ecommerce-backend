<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <style>
      .b{fill:#fff;stroke:#333;stroke-width:1.4}
      .dec{fill:#fff8e6;stroke:#b8860b;stroke-width:1.4}
      .store{fill:#eaf4ea;stroke:#2e7d32;stroke-width:1.4}
      .t{text-anchor:middle}
      .l{font-size:11px}
      .f{stroke:#333;stroke-width:1.3;fill:none}
      .title{font-weight:bold;font-size:16px}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <text x="500" y="22" class="t title">Feature Flow - GET /products/popular (read path) and write-through (write path)</text>

  <!-- READ PATH -->
  <text x="250" y="52" class="t" font-weight="bold">Read path</text>
  <rect x="150" y="65" width="200" height="40" rx="6" class="b"/>
  <text x="250" y="90" class="t">ProductController.getPopular()</text>
  <path d="M250,105 L250,125" class="f" marker-end="url(#a)"/>
  <rect x="130" y="125" width="240" height="40" rx="6" class="b"/>
  <text x="250" y="150" class="t">PopularProductCacheService.getPopularProducts()</text>
  <path d="M250,165 L250,185" class="f" marker-end="url(#a)"/>
  <rect x="150" y="185" width="200" height="40" rx="6" class="b"/>
  <text x="250" y="204" class="t l">SMEMBERS popular_products:ids</text>
  <text x="250" y="218" class="t l">HMGET popular_products id1 id2 ...</text>
  <path d="M250,225 L250,245" class="f" marker-end="url(#a)"/>
  <polygon points="250,245 330,280 250,315 170,280" class="dec"/>
  <text x="250" y="277" class="t l">Redis reachable</text>
  <text x="250" y="291" class="t l">and ids non-empty?</text>

  <path d="M330,280 L420,280" class="f" marker-end="url(#a)"/>
  <text x="375" y="274" class="t l">yes (hit)</text>
  <rect x="420" y="258" width="160" height="44" rx="6" class="b"/>
  <text x="500" y="276" class="t l">return List&lt;Product&gt;</text>
  <text x="500" y="292" class="t l">(~1 ms p50)</text>

  <path d="M250,315 L250,345" class="f" marker-end="url(#a)"/>
  <text x="300" y="334" class="t l">miss / outage</text>
  <rect x="130" y="345" width="240" height="56" rx="6" class="b"/>
  <text x="250" y="365" class="t l">for keyword in {iphone, macbook, jordan, rolex}</text>
  <text x="250" y="380" class="t l">productRepository.findByTitleKeyword(kw)</text>
  <text x="250" y="394" class="t l">(4 x SELECT ... LIKE '%kw%', ~4.5 ms p50)</text>
  <path d="M250,401 L250,425" class="f" marker-end="url(#a)"/>
  <polygon points="250,425 320,455 250,485 180,455" class="dec"/>
  <text x="250" y="459" class="t l">Redis up?</text>
  <path d="M320,455 L420,455" class="f" marker-end="url(#a)"/>
  <text x="370" y="449" class="t l">yes</text>
  <rect x="420" y="430" width="160" height="50" rx="6" class="b"/>
  <text x="500" y="449" class="t l">warm(): HSET + SADD per product</text>
  <text x="500" y="465" class="t l">EXPIRE both keys 600 s</text>
  <path d="M250,485 L250,510" class="f" marker-end="url(#a)"/>
  <text x="300" y="500" class="t l">no: log WARN</text>
  <rect x="150" y="510" width="200" height="36" rx="6" class="b"/>
  <text x="250" y="533" class="t l">return DB result (graceful degradation)</text>
  <path d="M580,455 L600,455 L600,280 L580,280" class="f" marker-end="url(#a)"/>

  <!-- WRITE PATH -->
  <text x="800" y="52" class="t" font-weight="bold">Write path (keeps cache coherent)</text>
  <rect x="690" y="65" width="220" height="40" rx="6" class="b"/>
  <text x="800" y="84" class="t l">POST/PUT/DELETE /products/{id}</text>
  <text x="800" y="98" class="t l">SelfProductService.create/update/delete</text>
  <path d="M800,105 L800,125" class="f" marker-end="url(#a)"/>
  <rect x="690" y="125" width="220" height="40" rx="6" class="b"/>
  <text x="800" y="150" class="t l">productRepository.save(product)  (DB first)</text>
  <path d="M800,165 L800,185" class="f" marker-end="url(#a)"/>
  <rect x="690" y="185" width="220" height="40" rx="6" class="b"/>
  <text x="800" y="210" class="t l">popularProductCache.onProductChanged(p)</text>
  <path d="M800,225 L800,245" class="f" marker-end="url(#a)"/>
  <polygon points="800,245 890,280 800,315 710,280" class="dec"/>
  <text x="800" y="277" class="t l">isPopular(p) and</text>
  <text x="800" y="291" class="t l">not deleted?</text>
  <path d="M710,280 L640,280 L640,350 L690,350" class="f" marker-end="url(#a)"/>
  <text x="640" y="272" class="t l">no</text>
  <rect x="690" y="330" width="220" height="40" rx="6" class="b"/>
  <text x="800" y="349" class="t l">evict: HDEL popular_products id</text>
  <text x="800" y="364" class="t l">SREM popular_products:ids id</text>
  <path d="M800,315 L800,400" class="f" marker-end="url(#a)"/>
  <text x="820" y="390" class="l">yes</text>
  <rect x="690" y="400" width="220" height="50" rx="6" class="b"/>
  <text x="800" y="420" class="t l">HSET popular_products id JSON(p)</text>
  <text x="800" y="436" class="t l">SADD popular_products:ids id; EXPIRE 600 s</text>
  <path d="M800,450 L800,475" class="f" marker-end="url(#a)"/>
  <rect x="690" y="475" width="220" height="36" rx="6" class="b"/>
  <text x="800" y="498" class="t l">Redis error -> catch, log WARN, continue</text>

  <!-- stores -->
  <rect x="640" y="520" width="150" height="30" rx="6" class="store"/><text x="715" y="540" class="t l">Redis 7 (Lettuce)</text>
  <rect x="810" y="520" width="150" height="30" rx="6" class="store"/><text x="885" y="540" class="t l">MySQL / H2 (JPA)</text>
</svg>
