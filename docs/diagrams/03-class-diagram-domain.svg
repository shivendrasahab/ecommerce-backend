<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <style>
      .cls{fill:#fff;stroke:#333;stroke-width:1.4}
      .hdr{fill:#e8eef7;stroke:#333;stroke-width:1.4}
      .enum{fill:#fdf6e3}
      .n{font-weight:bold;text-anchor:middle;font-size:13px}
      .st{text-anchor:middle;font-size:10px;fill:#555}
      .a{font-family:Menlo, Consolas, monospace;font-size:10px}
      .rel{stroke:#333;stroke-width:1.3;fill:none}
      .inh{stroke:#333;stroke-width:1.3;fill:none;stroke-dasharray:6 3}
      .m{font-size:11px;fill:#222}
    </style>
    <marker id="tri" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#333" stroke-width="1.2"/></marker>
    <marker id="dia" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto"><path d="M0,5 L7,0 L14,5 L7,10 z" fill="#333"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.3"/></marker>
  </defs>
  <text x="550" y="24" class="n" font-size="16">Class Diagram - Domain Model (JPA entities)</text>

  <!-- BaseModel -->
  <g transform="translate(440,45)">
    <rect width="220" height="24" class="hdr"/><text x="110" y="17" class="n">BaseModel {abstract}</text>
    <rect y="24" width="220" height="74" class="cls"/>
    <text x="8" y="41" class="a">- id : Long  (PK, IDENTITY)</text>
    <text x="8" y="56" class="a">- createdAt : Instant</text>
    <text x="8" y="71" class="a">- updatedAt : Instant</text>
    <text x="8" y="86" class="a">- deleted : boolean</text>
  </g>

  <!-- User -->
  <g transform="translate(40,200)">
    <rect width="250" height="24" class="hdr"/><text x="125" y="17" class="n">User</text>
    <rect y="24" width="250" height="74" class="cls"/>
    <text x="8" y="41" class="a">- name : String</text>
    <text x="8" y="56" class="a">- email : String  (unique)</text>
    <text x="8" y="71" class="a">- passwordHash : String</text>
    <text x="8" y="86" class="a">- phoneNumber : String; role : Role</text>
  </g>

  <!-- Session -->
  <g transform="translate(40,340)">
    <rect width="220" height="24" class="hdr"/><text x="110" y="17" class="n">Session</text>
    <rect y="24" width="220" height="60" class="cls"/>
    <text x="8" y="41" class="a">- token : String  (unique)</text>
    <text x="8" y="56" class="a">- expiresAt : Instant</text>
    <text x="8" y="71" class="a">- status : SessionStatus</text>
  </g>

  <!-- Cart -->
  <g transform="translate(40,470)">
    <rect width="220" height="24" class="hdr"/><text x="110" y="17" class="n">Cart</text>
    <rect y="24" width="220" height="60" class="cls"/>
    <text x="8" y="41" class="a">- items : List&lt;CartItem&gt;</text>
    <text x="8" y="56" class="a">+ getTotal() : double</text>
  </g>

  <!-- CartItem -->
  <g transform="translate(40,600)">
    <rect width="220" height="24" class="hdr"/><text x="110" y="17" class="n">CartItem</text>
    <rect y="24" width="220" height="44" class="cls"/>
    <text x="8" y="41" class="a">- quantity : Integer</text>
  </g>

  <!-- Category -->
  <g transform="translate(440,200)">
    <rect width="220" height="24" class="hdr"/><text x="110" y="17" class="n">Category</text>
    <rect y="24" width="220" height="60" class="cls"/>
    <text x="8" y="41" class="a">- name : String  (unique)</text>
    <text x="8" y="56" class="a">- description : String</text>
    <text x="8" y="71" class="a">- products : List&lt;Product&gt;</text>
  </g>

  <!-- Product -->
  <g transform="translate(440,340)">
    <rect width="220" height="24" class="hdr"/><text x="110" y="17" class="n">Product</text>
    <rect y="24" width="220" height="104" class="cls"/>
    <text x="8" y="41" class="a">- title : String  (indexed)</text>
    <text x="8" y="56" class="a">- description : String(2000)</text>
    <text x="8" y="71" class="a">- price : Double  (indexed)</text>
    <text x="8" y="86" class="a">- imageUrl : String</text>
    <text x="8" y="101" class="a">- stock : Integer</text>
    <text x="8" y="116" class="a">- externalId : Long</text>
  </g>

  <!-- Order -->
  <g transform="translate(820,200)">
    <rect width="220" height="24" class="hdr"/><text x="110" y="17" class="n">Order  (table: orders)</text>
    <rect y="24" width="220" height="74" class="cls"/>
    <text x="8" y="41" class="a">- items : List&lt;OrderItem&gt;</text>
    <text x="8" y="56" class="a">- totalAmount : Double</text>
    <text x="8" y="71" class="a">- status : OrderStatus</text>
    <text x="8" y="86" class="a">- shippingAddress : String</text>
  </g>

  <!-- OrderItem -->
  <g transform="translate(820,340)">
    <rect width="220" height="24" class="hdr"/><text x="110" y="17" class="n">OrderItem</text>
    <rect y="24" width="220" height="44" class="cls"/>
    <text x="8" y="41" class="a">- quantity : Integer</text>
    <text x="8" y="56" class="a">- unitPrice : Double  (snapshot)</text>
  </g>

  <!-- Payment -->
  <g transform="translate(820,470)">
    <rect width="250" height="24" class="hdr"/><text x="125" y="17" class="n">Payment</text>
    <rect y="24" width="250" height="74" class="cls"/>
    <text x="8" y="41" class="a">- provider : PaymentProvider</text>
    <text x="8" y="56" class="a">- providerReferenceId : String</text>
    <text x="8" y="71" class="a">- paymentLink : String(1000)</text>
    <text x="8" y="86" class="a">- amount : Double; status : PayStatus</text>
  </g>

  <!-- Enums -->
  <g transform="translate(440,520)">
    <rect width="220" height="24" class="hdr enum"/><text x="110" y="17" class="n">&lt;&lt;enum&gt;&gt; OrderStatus</text>
    <rect y="24" width="220" height="44" class="cls enum"/>
    <text x="8" y="43" class="a">PENDING_PAYMENT, PAID,</text>
    <text x="8" y="58" class="a">CANCELLED, FULFILLED</text>
  </g>
  <g transform="translate(440,590)">
    <rect width="220" height="24" class="hdr enum"/><text x="110" y="17" class="n">&lt;&lt;enum&gt;&gt; PaymentStatus, Provider</text>
    <rect y="24" width="220" height="44" class="cls enum"/>
    <text x="8" y="43" class="a">INITIATED, SUCCESS, FAILED</text>
    <text x="8" y="58" class="a">RAZORPAY, STRIPE</text>
  </g>
  <g transform="translate(440,670)">
    <rect width="220" height="24" class="hdr enum"/><text x="110" y="17" class="n">&lt;&lt;enum&gt;&gt; Role / SessionStatus</text>
    <rect y="24" width="220" height="44" class="cls enum"/>
    <text x="8" y="43" class="a">CUSTOMER, ADMIN</text>
    <text x="8" y="58" class="a">ACTIVE, EXPIRED, LOGGED_OUT</text>
  </g>

  <!-- Inheritance (dashed to BaseModel) -->
  <path d="M150,200 L150,160 L550,160 L550,143" class="inh" marker-end="url(#tri)"/>
  <path d="M550,200 L550,143" class="inh"/>
  <path d="M930,200 L930,160 L550,160" class="inh"/>
  <text x="700" y="155" class="m">all entities extend BaseModel</text>

  <!-- Relationships -->
  <!-- Session -> User -->
  <path d="M150,340 L150,298" class="rel" marker-end="url(#ar)"/>
  <text x="156" y="322" class="m">* -> 1  user</text>
  <!-- Cart -> User (1-1) -->
  <path d="M260,500 L300,500 L300,250 L260,250" class="rel" marker-end="url(#ar)"/>
  <text x="305" y="380" class="m">1 - 1 user (unique)</text>
  <!-- Cart <>- CartItem -->
  <path d="M150,600 L150,554" class="rel" marker-end="url(#dia)"/>
  <text x="156" y="582" class="m">1 to many items (cascade, orphanRemoval)</text>
  <!-- CartItem -> Product -->
  <path d="M260,640 L400,640 L400,420 L440,420" class="rel" marker-end="url(#ar)"/>
  <text x="300" y="632" class="m">* -> 1 product</text>
  <!-- Product -> Category -->
  <path d="M550,340 L550,284" class="rel" marker-end="url(#ar)"/>
  <text x="556" y="316" class="m">* -> 1 category</text>
  <!-- Order -> User -->
  <path d="M820,240 L700,240 L700,180 L300,180 L300,224 L260,224" class="rel" marker-end="url(#ar)"/>
  <text x="705" y="235" class="m">* -> 1 user</text>
  <!-- Order <>- OrderItem -->
  <path d="M930,340 L930,298" class="rel" marker-end="url(#dia)"/>
  <text x="936" y="322" class="m">1 to many items</text>
  <!-- OrderItem -> Product -->
  <path d="M820,380 L660,380" class="rel" marker-end="url(#ar)"/>
  <text x="700" y="372" class="m">* -> 1 product</text>
  <!-- Payment -> Order -->
  <path d="M1070,470 L1085,470 L1085,250 L1040,250" class="rel" marker-end="url(#ar)"/>
  <text x="1092" y="366" class="m" transform="rotate(90 1092 366)">* -> 1 order</text>
</svg>
