<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <style>
      .t{text-anchor:middle}
      .ax{stroke:#333;stroke-width:1.2}
      .grid{stroke:#ddd;stroke-width:1}
      .db{fill:#c0504d}
      .rd{fill:#4f81bd}
      .v{font-size:11px;text-anchor:middle;font-weight:bold}
    </style>
  </defs>
  <text x="410" y="24" class="t" font-weight="bold" font-size="16">GET /products/popular latency - database vs Redis (200 requests each, local)</text>

  <!-- axes: plot area x 90..770, y 60..340 ; scale 0..8 ms -> 280px => 35px/ms -->
  <line x1="90" y1="340" x2="770" y2="340" class="ax"/>
  <line x1="90" y1="60" x2="90" y2="340" class="ax"/>
  <g>
    <line x1="90" y1="305" x2="770" y2="305" class="grid"/><text x="80" y="309" text-anchor="end">1</text>
    <line x1="90" y1="270" x2="770" y2="270" class="grid"/><text x="80" y="274" text-anchor="end">2</text>
    <line x1="90" y1="235" x2="770" y2="235" class="grid"/><text x="80" y="239" text-anchor="end">3</text>
    <line x1="90" y1="200" x2="770" y2="200" class="grid"/><text x="80" y="204" text-anchor="end">4</text>
    <line x1="90" y1="165" x2="770" y2="165" class="grid"/><text x="80" y="169" text-anchor="end">5</text>
    <line x1="90" y1="130" x2="770" y2="130" class="grid"/><text x="80" y="134" text-anchor="end">6</text>
    <line x1="90" y1="95" x2="770" y2="95" class="grid"/><text x="80" y="99" text-anchor="end">7</text>
    <line x1="90" y1="60" x2="770" y2="60" class="grid"/><text x="80" y="64" text-anchor="end">8</text>
    <text x="80" y="344" text-anchor="end">0</text>
  </g>
  <text x="30" y="200" class="t" transform="rotate(-90 30 200)">latency (ms)</text>

  <!-- groups: p50, p95, p99, mean ; group width 170, centres at 175, 345, 515, 685 -->
  <!-- p50: db 4.52 -> h=158.2 ; redis 0.99 -> h=34.65 -->
  <rect x="125" y="181.8" width="45" height="158.2" class="db"/><text x="147.5" y="176" class="v">4.52</text>
  <rect x="180" y="305.35" width="45" height="34.65" class="rd"/><text x="202.5" y="300" class="v">0.99</text>
  <text x="175" y="360" class="t">p50</text>
  <!-- p95: db 6.55 -> 229.25 ; redis 1.87 -> 65.45 -->
  <rect x="295" y="110.75" width="45" height="229.25" class="db"/><text x="317.5" y="105" class="v">6.55</text>
  <rect x="350" y="274.55" width="45" height="65.45" class="rd"/><text x="372.5" y="269" class="v">1.87</text>
  <text x="345" y="360" class="t">p95</text>
  <!-- p99: db 7.20 -> 252 ; redis 2.32 -> 81.2 -->
  <rect x="465" y="88" width="45" height="252" class="db"/><text x="487.5" y="82" class="v">7.20</text>
  <rect x="520" y="258.8" width="45" height="81.2" class="rd"/><text x="542.5" y="253" class="v">2.32</text>
  <text x="515" y="360" class="t">p99</text>
  <!-- mean: db 4.77 -> 166.95 ; redis 1.12 -> 39.2 -->
  <rect x="635" y="173.05" width="45" height="166.95" class="db"/><text x="657.5" y="167" class="v">4.77</text>
  <rect x="690" y="300.8" width="45" height="39.2" class="rd"/><text x="712.5" y="295" class="v">1.12</text>
  <text x="685" y="360" class="t">mean</text>

  <!-- legend -->
  <rect x="250" y="385" width="14" height="14" class="db"/><text x="270" y="396">Database path (cache flushed; 4 LIKE queries)</text>
  <rect x="520" y="385" width="14" height="14" class="rd"/><text x="540" y="396">Redis path (warm; SMEMBERS + HMGET)</text>
</svg>
